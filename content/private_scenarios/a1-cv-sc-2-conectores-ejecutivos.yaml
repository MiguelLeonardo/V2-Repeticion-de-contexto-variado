roleplay:
  ai_role: Executive Communication & Interview Coach
  user_role: Team Leader Candidate
  setting: 'Práctica básica A1 sobre: Conectores Ejecutivos en Contexto Operativo
    (CV).'
  turns:
  - speaker: ai
    text: Hello! Tell me about your work and tools.
  - speaker: user
    goal: Responde en presente simple usando frases cortas (4 a 7 palabras).
    suggested_lines:
    - I check data and fix errors.
    - Orders rise, so we add staff.
  - speaker: ai
    text: Great! How do you help your team every day?
  - speaker: user
    goal: Menciona cómo apoyas al equipo con vocabulario básico.
