roleplay:
  ai_role: Systems Automation & ERP Lead
  user_role: Automation & Process Specialist
  setting: Revisión técnica sobre integraciones n8n, SAP ERP, simulación de escenarios
    en SIMIO y control de versiones con Git/GitHub.
  turns:
  - speaker: ai
    text: Walk me through how you used n8n, SAP, and SIMIO in your operations roles.
  - speaker: user
    goal: Explica el release automático de órdenes congeladas con n8n, respaldo en
      SAP y simulación en SIMIO antes de cambiar producción.
    suggested_lines:
    - At Rappi, I built n8n workflows to automatically release stuck orders, cutting
      SLA breaches and manual backlog.
    - I also leverage SAP ERP integrations and SIMIO simulations to test changes safely
      before touching live operations.
  - speaker: ai
    text: How do you govern documentation and workflow versions?
  - speaker: user
    goal: Menciona CMS, Git y GitHub para trazabilidad y control de cambios.
    suggested_lines:
    - I manage content via CMS and govern all scripts and SOP versions with Git and
      GitHub for full auditability.
