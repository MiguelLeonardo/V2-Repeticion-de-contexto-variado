roleplay:
  ai_role: DHL GSC Hiring Manager (Bogotá)
  user_role: Team Leader (Business Support) Candidate
  setting: 'Práctica básica A1 sobre: Módulo 1: Perfil Profesional, Liderazgo GSC
    y Storytelling.'
  turns:
  - speaker: ai
    text: Hello! Tell me about your work and tools.
  - speaker: user
    goal: Responde en presente simple usando frases cortas (4 a 7 palabras).
    suggested_lines:
    - Hello! I am an Industrial Engineer.
    - Can I show you my data report?
  - speaker: ai
    text: Great! How do you help your team every day?
  - speaker: user
    goal: Menciona cómo apoyas al equipo con vocabulario básico.
    suggested_lines:
    - There are sixty people on my team.
    - Good tools help us work faster.
