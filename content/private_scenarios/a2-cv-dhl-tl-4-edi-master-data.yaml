roleplay:
  ai_role: DHL Master Data & Systems Integration Manager
  user_role: Team Leader (Business Support) Candidate
  setting: 'Conversación A2 sobre experiencia pasada y peticiones sencillas en: Módulo
    4: Integraciones EDI, Master Data y Cadena de Suministro.'
  turns:
  - speaker: ai
    text: Hi! What did you do in your last job?
  - speaker: user
    goal: Usa pasado simple básico para contar qué hiciste.
    suggested_lines:
    - We used live tracking to check every file.
    - Could you check the SAP and EDI logs?
  - speaker: ai
    text: That sounds helpful. What do you want to check today?
  - speaker: user
    goal: Haz una pregunta cortés con 'Could you...' o describe tu apoyo.
    suggested_lines:
    - I checked vendor files before the audit started.
    - I studied supply costs to save money.
