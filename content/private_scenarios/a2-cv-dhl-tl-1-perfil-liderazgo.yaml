id: a2-cv-dhl-tl-1-perfil-liderazgo
title: 'Module 1: Profile, Leadership & Storytelling'
title_es: 'Módulo 1: Perfil Profesional, Liderazgo GSC y Storytelling'
cefr: A2
topic: cv-dhl-gsc-tl
description: Presentación profesional, analítica de datos, excelencia operativa, comunicación
  con stakeholders y liderazgo.
phrases:
- id: dhl-tl-1-1
  text: I worked as an operations manager in Bogotá.
  translation: Trabajé como gerente de operaciones en Bogotá.
  visual_hint: 🏭📊
  cloze:
  - 1
  glossary:
  - word: worked
    meaning: trabajé
  common: true
  kind: phrase
  apply_sentence: I ____ as a manager last year.
  apply_answer: worked
  apply_translation: Trabajé como gerente el año pasado.
- id: dhl-tl-1-2
  text: Could you look at these daily KPI numbers?
  translation: ¿Podrías mirar estas cifras diarias de KPI?
  visual_hint: 📈🎯
  cloze:
  - 0
  - 1
  glossary:
  - word: Could you
    meaning: podrías
  common: true
  kind: phrase
  apply_sentence: ____ look at these numbers?
  apply_answer: Could you
  apply_translation: ¿Podrías mirar estas cifras?
- id: dhl-tl-1-3
  text: We fixed small problems to save company money.
  translation: Arreglamos problemas pequeños para ahorrar dinero.
  visual_hint: ⚙️💰
  cloze:
  - 1
  glossary:
  - word: fixed
    meaning: arreglamos
  common: true
  kind: phrase
  apply_sentence: We ____ problems early yesterday.
  apply_answer: fixed
  apply_translation: Arreglamos problemas temprano ayer.
- id: dhl-tl-1-4
  text: There is a clear plan for our global team.
  translation: Hay un plan claro para nuestro equipo global.
  visual_hint: 🌍🤝
  cloze:
  - 0
  - 1
  glossary:
  - word: There is
    meaning: hay (singular)
  common: true
  kind: phrase
  apply_sentence: ____ a clear plan for the team.
  apply_answer: There is
  apply_translation: Hay un plan claro para el equipo.
- id: dhl-tl-1-5
  text: I guided my team and checked their results.
  translation: Guié a mi equipo y revisé sus resultados.
  visual_hint: 👥📋
  cloze:
  - 1
  glossary:
  - word: guided
    meaning: guié
  common: true
  kind: phrase
  apply_sentence: I ____ my team every week.
  apply_answer: guided
  apply_translation: Guié a mi equipo cada semana.
roleplay:
  ai_role: DHL GSC Hiring Manager (Bogotá)
  user_role: Team Leader (Business Support) Candidate
  setting: 'Conversación A2 sobre experiencia pasada y peticiones sencillas en: Módulo
    1: Perfil Profesional, Liderazgo GSC y Storytelling.'
  turns:
  - speaker: ai
    text: Hi! What did you do in your last job?
  - speaker: user
    goal: Usa pasado simple básico para contar qué hiciste.
    suggested_lines:
    - I worked as an operations manager in Bogotá.
    - We fixed small problems to save company money.
  - speaker: ai
    text: That sounds helpful. What do you want to check today?
  - speaker: user
    goal: Haz una pregunta cortés con 'Could you...' o describe tu apoyo.
    suggested_lines:
    - Could you look at these daily KPI numbers?
    - There is a clear plan for our global team.
