phrases:
- id: dhl-tl-5-1
  text: We used Asana and Notion to plan every step.
  translation: Usamos Asana y Notion para planear cada paso.
  visual_hint: 🗺️🚧
  cloze:
  - 1
  glossary:
  - word: used
    meaning: usamos
  common: true
  kind: phrase
  apply_sentence: We ____ Asana for our project.
  apply_answer: used
  apply_translation: Usamos Asana para nuestro proyecto.
- id: dhl-tl-5-2
  text: Could we check the SPI and CPI budget numbers?
  translation: ¿Podríamos revisar las cifras SPI y CPI?
  visual_hint: ✂️💵
  cloze:
  - 0
  - 1
  glossary:
  - word: Could we
    meaning: podríamos
  common: true
  kind: phrase
  apply_sentence: ____ check the budget numbers?
  apply_answer: Could we
  apply_translation: ¿Podríamos revisar las cifras de presupuesto?
- id: dhl-tl-5-3
  text: I tested new reports before the team used them.
  translation: Probé nuevos reportes antes de que el equipo los usara.
  visual_hint: 📅🔄
  cloze:
  - 1
  glossary:
  - word: tested
    meaning: probé
  common: true
  kind: phrase
  apply_sentence: I ____ the reports before launch.
  apply_answer: tested
  apply_translation: Probé los reportes antes del lanzamiento.
