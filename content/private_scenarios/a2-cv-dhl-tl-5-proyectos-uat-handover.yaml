  cloze:
  - 1
  glossary:
  - word: planned
    meaning: planeé
  common: true
  kind: phrase
  apply_sentence: I ____ shifts at El Carutal.
  apply_answer: planned
  apply_translation: Planeé turnos en El Carutal.
- id: dhl-tl-5-5
  text: We sent clear reports to our corporate clients.
  translation: Enviamos reportes claros a clientes corporativos.
  visual_hint: ✍️🤝
  cloze:
  - 1
  glossary:
  - word: sent
