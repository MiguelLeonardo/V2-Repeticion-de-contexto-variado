    5: Implementación de Proyectos, UAT y Handover Operativo.'
  turns:
  - speaker: ai
    text: Hi! What did you do in your last job?
  - speaker: user
    goal: Usa pasado simple básico para contar qué hiciste.
    suggested_lines:
    - We used Asana and Notion to plan every step.
    - I tested new reports before the team used them.
  - speaker: ai
    text: That sounds helpful. What do you want to check today?
  - speaker: user
    goal: Haz una pregunta cortés con 'Could you...' o describe tu apoyo.
    suggested_lines:
    - Could we check the SPI and CPI budget numbers?
    - I planned worker shifts so the plant stayed ready.
