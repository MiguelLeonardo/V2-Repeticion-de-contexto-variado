id: b2-cv-dhl-tl-1-perfil-liderazgo
title: 'Module 1: Profile, Leadership & Storytelling'
title_es: 'Módulo 1: Perfil Profesional, Liderazgo GSC y Storytelling'
cefr: B2
topic: cv-dhl-gsc-tl
description: Presentación profesional, analítica de datos, excelencia operativa, comunicación
  con stakeholders y liderazgo.
phrases:
- id: dhl-tl-1-1
  text: Having worked in operations, I standardize reporting across the board.
  translation: Habiendo trabajado en operaciones, estandarizo reportes en todas las
    áreas.
  visual_hint: 🏭📊
  cloze:
  - 7
  - 8
  glossary:
  - word: across the board
    meaning: en todos los ámbitos
  common: true
  kind: idiom
  apply_sentence: Automation improved accuracy ____.
  apply_answer: across the board
  apply_translation: La automatización mejoró la precisión en todos los ámbitos.
- id: dhl-tl-1-2
  text: I translate large datasets into insights that really move the needle.
  translation: Traduzco grandes datos en hallazgos que generan un impacto real.
  visual_hint: 📈🎯
  cloze:
  - 8
  - 9
  glossary:
  - word: move the needle
    meaning: generar impacto real
  common: true
  kind: idiom
  apply_sentence: Executive dashboards must ____ on service quality.
  apply_answer: move the needle
  apply_translation: Los tableros ejecutivos deben generar un impacto real en la calidad.
- id: dhl-tl-1-3
  text: If we automate tasks, we can iron out friction and cut costs.
  translation: Si automatizamos tareas, podemos pulir fricciones y reducir costos.
  visual_hint: ⚙️💰
  cloze:
  - 6
  - 7
  glossary:
  - word: iron out
    meaning: pulir / resolver
  common: true
  kind: idiom
  apply_sentence: We met early to ____ process issues.
  apply_answer: iron out
  apply_translation: Nos reunimos temprano para resolver problemas del proceso.
- id: dhl-tl-1-4
  text: I act as the main contact to get everyone on the same page.
  translation: Actúo como contacto principal para alinear a todo el equipo.
  visual_hint: 🌍🤝
  cloze:
  - 11
  - 12
  glossary:
  - word: same page
    meaning: misma sintonía
  common: true
  kind: idiom
  apply_sentence: Clear summaries help get everyone on the ____.
  apply_answer: same page
  apply_translation: Los resúmenes claros ayudan a poner a todos en la misma sintonía.
- id: dhl-tl-1-5
  text: I have been overseeing teams and holding them accountable for SLAs.
  translation: He estado supervisando equipos y exigiéndoles cumplimiento de SLAs.
  visual_hint: 👥📋
  cloze:
  - 8
  glossary:
  - word: accountable
    meaning: responsables
  common: true
  kind: idiom
  apply_sentence: Leaders must hold staff ____ for quality.
  apply_answer: accountable
  apply_translation: Los líderes deben hacer responsable al personal por la calidad.
roleplay:
  ai_role: DHL GSC Hiring Manager (Bogotá)
  user_role: Team Leader (Business Support) Candidate
  setting: 'Entrevista técnica B2 con condicionales y colocaciones en: Módulo 1: Perfil
    Profesional, Liderazgo GSC y Storytelling.'
  turns:
  - speaker: ai
    text: How would you handle bottlenecks or data quality risks across regional teams?
  - speaker: user
    goal: Usa condicionales, voz pasiva o colocaciones profesionales.
    suggested_lines:
    - Having worked in operations, I standardize reporting across the board.
    - I translate large datasets into insights that really move the needle.
  - speaker: ai
    text: And what practices have you been using to maintain high performance?
  - speaker: user
    goal: Describe prácticas continuas y resultados medibles.
    suggested_lines:
    - If we automate tasks, we can iron out friction and cut costs.
    - I act as the main contact to get everyone on the same page.
