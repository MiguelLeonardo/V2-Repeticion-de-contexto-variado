phrases:
- id: cv-tech-2-n8n-sap-simio-1
  text: I integrated n8n workflows to release frozen orders automatically.
  translation: Integré flujos n8n para liberar órdenes congeladas automáticamente.
  visual_hint: ⚡🔧
  cloze:
  - 5
  glossary:
  - word: release
    meaning: liberar
  common: true
  kind: idiom
  apply_sentence: n8n flows ____ stuck tickets.
  apply_answer: release
  apply_translation: Flujos n8n liberan tickets atascados.
- id: cv-tech-2-n8n-sap-simio-2
  text: We optimized card budgets so we could reduce fraud rates.
  translation: Optimizamos presupuestos de tarjetas para reducir fraude.
  visual_hint: ⚡🔧
  cloze:
  - 7
  glossary:
  - word: reduce
    meaning: reducir
  common: true
  kind: idiom
  apply_sentence: Smart controls ____ fraud risk.
  apply_answer: reduce
  apply_translation: Controles inteligentes reducen fraude.
- id: cv-tech-2-n8n-sap-simio-3
  text: My SAP ERP experience helps me troubleshoot order integration errors.
  translation: Mi experiencia SAP ERP ayuda a resolver errores de integración.
