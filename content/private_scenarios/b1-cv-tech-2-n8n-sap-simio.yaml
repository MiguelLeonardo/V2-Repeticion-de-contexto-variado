  cloze:
  - 8
  glossary:
  - word: before
    meaning: antes de
  common: true
  kind: idiom
  apply_sentence: Test models ____ changing live flows.
  apply_answer: before
  apply_translation: Prueba modelos antes de cambiar en vivo.
- id: cv-tech-2-n8n-sap-simio-5
  text: I use Git, GitHub, and CMS tools to organize documentation.
