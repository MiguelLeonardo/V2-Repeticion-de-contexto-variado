id: c1-cv-tech-3-data-analytics
title: 'Data Analytics: Python, SQL, Power BI & ETL'
title_es: 'Analítica de Datos: Python, SQL, Power BI, Excel y ETL'
cefr: C1
topic: cv-dhl-gsc-tl
description: 'Stack analítico avanzado: Python, SQL (Avanzado), Power BI, MS Excel
  (Avanzado), Data Insights Models, ETL y análisis cuantitativo CPGS.'
phrases:
- id: cv-tech-3-data-analytics-1
  text: Combining SQL, Python, and Power BI lets me sift through noise and connect
    the dots fast.
  translation: Combinar SQL, Python y Power BI permite filtrar ruido y conectar patrones
    rápido.
  visual_hint: 📊🐍
  cloze:
  - 12
  - 13
  glossary:
  - word: connect the dots
    meaning: conectar patrones
  common: true
  kind: idiom
  apply_sentence: Data models help execs ____.
  apply_answer: connect the dots
  apply_translation: Modelos ayudan a conectar patrones.
- id: cv-tech-3-data-analytics-2
  text: Architecting automated ETL pipelines from the ground up ensures scalable reporting
    across teams.
  translation: Diseñar pipelines ETL desde cero asegura reportes escalables entre
    equipos.
  visual_hint: 📊🐍
  cloze:
  - 4
  - 5
  glossary:
  - word: from the ground up
    meaning: desde cero
  common: true
  kind: idiom
  apply_sentence: Scorecards built ____ scale easily.
  apply_answer: from the ground up
  apply_translation: Scorecards desde cero escalan fácil.
- id: cv-tech-3-data-analytics-3
  text: Drilling down into CPG supply traceability uncovered savings that really moved
    the needle.
  translation: Profundizar en trazabilidad CPG reveló ahorros que generaron impacto
    real.
  visual_hint: 📊🐍
  cloze:
  - 10
  - 11
  glossary:
  - word: moved the needle
    meaning: impacto real
  common: true
  kind: idiom
  apply_sentence: Cost insights ____ on margins.
  apply_answer: moved the needle
  apply_translation: Hallazgos de costo impactaron márgenes.
- id: cv-tech-3-data-analytics-4
  text: We use advanced Excel and Python to crunch the numbers behind every capacity
    forecast.
  translation: Usamos Excel avanzado y Python para procesar cifras detrás de cada
    pronóstico.
  visual_hint: 📊🐍
  cloze:
  - 7
  - 8
  glossary:
  - word: crunch the numbers
    meaning: procesar cifras
  common: true
  kind: idiom
  apply_sentence: Analysts ____ before planning shifts.
  apply_answer: crunch the numbers
  apply_translation: Analistas procesan cifras antes.
- id: cv-tech-3-data-analytics-5
  text: Translating data insight models into executive visuals gets everyone on the
    same page.
  translation: Traducir modelos de datos en visuales ejecutivos alinea a todo el equipo.
  visual_hint: 📊🐍
  cloze:
  - 11
  - 12
  glossary:
  - word: same page
    meaning: misma sintonía
  common: true
  kind: idiom
  apply_sentence: Clear KPIs put teams on the ____.
  apply_answer: same page
  apply_translation: KPIs claros ponen en sintonía.
roleplay:
  ai_role: Head of Business Intelligence & Data
  user_role: Data-Driven Operations Lead
  setting: Entrevista técnica sobre construcción de pipelines ETL, consultas SQL avanzadas,
    modelos en Python y tableros ejecutivos en Power BI/Excel.
  turns:
  - speaker: ai
    text: How do you combine Excel, SQL, Python, and Power BI to turn raw operational
      data into decisions?
  - speaker: user
    goal: Explica cómo construyes modelos ETL desde cero para procesar cifras y conectar
      patrones en Power BI.
    suggested_lines:
    - I build automated ETL pipelines from the ground up using Python and SQL to clean
      massive datasets reliably.
    - Then I surface executive insights in Power BI and advanced Excel so leaders
      can connect the dots immediately.
  - speaker: ai
    text: Give me an example from your time as a CPG Operations Analyst at Rappi.
  - speaker: user
    goal: Menciona análisis cuantitativo de trazabilidad, monitoreo de KPIs logísticos
      y reducción de costos de distribución.
    suggested_lines:
    - As a CPG Operations Analyst, I drilled down into supply traceability data and
      tracked logistics KPIs to cut distribution costs and speed up fulfillment.
