  apply_translation: Nuestro hub conectó conductores y almacenes.
- id: dhl-tl-2-2
  text: We used clear steps when a problem happened.
  translation: Usamos pasos claros cuando ocurría un problema.
  visual_hint: 🧯🚀
  cloze:
  - 3
  glossary:
  - word: steps
    meaning: pasos
