    Nómina (NGSOFT), ISO y Estudios de Tiempos (Tecnicolor).'
  turns:
  - speaker: ai
    text: Could you explain how you improved workflows or metrics in your previous
      roles?
  - speaker: user
    goal: Responde usando conectores funcionales (in order to, so that, because) o
      Present Perfect.
    suggested_lines:
    - I coordinated field crews while administering payroll in NGSOFT.
    - Supporting ISO audits taught me how to document processes clearly.
  - speaker: ai
    text: How do you keep your team or projects organized when demand grows?
  - speaker: user
    goal: Explica tu método laboral con claridad nivel B1.
    suggested_lines:
    - My diploma in Talent Management strengthened my coaching skills.
    - At Tecnicolor, I ran time-and-motion studies to spot inefficiencies.
