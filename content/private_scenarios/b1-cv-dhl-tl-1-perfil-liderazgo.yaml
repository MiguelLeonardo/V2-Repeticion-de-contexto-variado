id: b1-cv-dhl-tl-1-perfil-liderazgo
title: 'Module 1: Profile, Leadership & Storytelling'
title_es: 'Módulo 1: Perfil Profesional, Liderazgo GSC y Storytelling'
cefr: B1
topic: cv-dhl-gsc-tl
description: Presentación profesional, analítica de datos, excelencia operativa, comunicación
  con stakeholders y liderazgo.
phrases:
- id: dhl-tl-1-1
  text: As an Industrial Engineer, I improve workflows across all teams.
  translation: Como Ingeniero Industrial, mejoro flujos en todos los equipos.
  visual_hint: 🏭📊
  cloze:
  - 7
  - 8
  glossary:
  - word: across all
    meaning: en todos los
  common: true
  kind: idiom
  apply_sentence: We standardized reports ____ regional teams.
  apply_answer: across all
  apply_translation: Estandarizamos reportes en todos los equipos regionales.
- id: dhl-tl-1-2
  text: I turn complex data into insights that improve performance.
  translation: Convierto datos complejos en hallazgos que mejoran el desempeño.
  visual_hint: 📈🎯
  cloze:
  - 5
  glossary:
  - word: insights
    meaning: hallazgos / conclusiones
  common: true
  kind: idiom
  apply_sentence: Dashboards give us clear ____ for decisions.
  apply_answer: insights
  apply_translation: Los tableros nos dan hallazgos claros para decidir.
- id: dhl-tl-1-3
  text: We reduce user friction in order to protect profits.
  translation: Reducimos la fricción del usuario para proteger las ganancias.
  visual_hint: ⚙️💰
  cloze:
  - 4
  - 5
  glossary:
  - word: in order to
    meaning: para / con el fin de
  common: true
  kind: idiom
  apply_sentence: We automate tasks ____ save time.
  apply_answer: in order to
  apply_translation: Automatizamos tareas para ahorrar tiempo.
- id: dhl-tl-1-4
  text: I use clear stories so that global teams stay aligned.
  translation: Uso historias claras para que los equipos globales sigan alineados.
  visual_hint: 🌍🤝
  cloze:
  - 9
  glossary:
  - word: aligned
    meaning: alineados
  common: true
  kind: idiom
  apply_sentence: Weekly meetings keep all partners ____.
  apply_answer: aligned
  apply_translation: Las reuniones semanales mantienen alineados a todos los socios.
- id: dhl-tl-1-5
  text: I have managed large teams and coached them on goals.
  translation: He gestionado equipos grandes y los he guiado en metas.
  visual_hint: 👥📋
  cloze:
  - 6
  glossary:
  - word: coached
    meaning: entrenado / guiado
  common: true
  kind: idiom
  apply_sentence: I regularly ____ analysts on SLA targets.
  apply_answer: coached
  apply_translation: Regularmente entreno a los analistas en metas SLA.
roleplay:
  ai_role: DHL GSC Hiring Manager (Bogotá)
  user_role: Team Leader (Business Support) Candidate
  setting: 'Entrevista funcional B1 sobre procesos y resultados en: Módulo 1: Perfil
    Profesional, Liderazgo GSC y Storytelling.'
  turns:
  - speaker: ai
    text: Could you explain how you improved workflows or metrics in your previous
      roles?
  - speaker: user
    goal: Responde usando conectores funcionales (in order to, so that, because) o
      Present Perfect.
    suggested_lines:
    - As an Industrial Engineer, I improve workflows across all teams.
    - I turn complex data into insights that improve performance.
  - speaker: ai
    text: How do you keep your team or projects organized when demand grows?
  - speaker: user
    goal: Explica tu método laboral con claridad nivel B1.
    suggested_lines:
    - We reduce user friction in order to protect profits.
    - I use clear stories so that global teams stay aligned.
