    suggested_lines:
    - I directed supply strategies for timber channels and plant fulfillment.
    - We forecasted labor needs to match factory manufacturing loads.
  - speaker: ai
    text: How do you keep your team or projects organized when demand grows?
  - speaker: user
    goal: Explica tu método laboral con claridad nivel B1.
    suggested_lines:
    - I led quality checks for incoming materials and outbound deliveries.
    - By creating holiday playbooks, we improved delivery times at Rappi.
