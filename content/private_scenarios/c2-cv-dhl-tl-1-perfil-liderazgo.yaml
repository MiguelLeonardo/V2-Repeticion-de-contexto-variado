id: c2-cv-dhl-tl-1-perfil-liderazgo
title: 'Module 1: Profile, Leadership & Storytelling'
title_es: 'Módulo 1: Perfil Profesional, Liderazgo GSC y Storytelling'
cefr: C2
topic: cv-dhl-gsc-tl
description: Presentación profesional, analítica de datos, excelencia operativa, comunicación
  con stakeholders y liderazgo.
phrases:
- id: dhl-tl-1-1
  text: Not only have I streamlined workflows, but I have also standardized reporting
    across the board.
  translation: No solo he agilizado flujos, sino que también estandaricé reportes
    en todas las áreas.
  visual_hint: 🏭📊
  cloze:
  - 4
  - 12
  glossary:
  - word: streamlined
    meaning: agilizado / en todas las áreas
  - word: across the board
    meaning: agilizado / en todas las áreas
  common: true
  kind: idiom
  apply_sentence: By standardizing governance, we improved reliability ____.
  apply_answer: across the board
  apply_translation: Al estandarizar la gobernanza, mejoramos la fiabilidad en todas
    las áreas.
- id: dhl-tl-1-2
  text: Seldom do raw spreadsheets suffice; only data-driven insights truly move the
    needle.
  translation: Rara vez bastan hojas crudas; solo hallazgos basados en datos generan
    impacto real.
  visual_hint: 📈🎯
  cloze:
  - 6
  - 9
  glossary:
  - word: data-driven
    meaning: basados en datos / impacto real
  - word: move the needle
    meaning: basados en datos / impacto real
  common: true
  kind: idiom
  apply_sentence: Without ____, strategic reviews rarely move the needle.
  apply_answer: data-driven insights
  apply_translation: Sin hallazgos basados en datos, las revisiones rara vez generan
    impacto.
- id: dhl-tl-1-3
  text: Were we to automate capacity management, we would iron out friction and boost
    profitability.
  translation: Si automatizáramos la capacidad, puliríamos fricciones y elevaríamos
    la rentabilidad.
  visual_hint: ⚙️💰
  cloze:
  - 8
  - 9
  glossary:
  - word: iron out
    meaning: pulir / rentabilidad
  - word: profitability
    meaning: pulir / rentabilidad
  common: true
  kind: idiom
  apply_sentence: Process discipline helps ____ bottlenecks and protect profitability.
  apply_answer: iron out
  apply_translation: La disciplina de procesos ayuda a pulir cuellos de botella y
    proteger rentabilidad.
- id: dhl-tl-1-4
  text: By framing the big picture through storytelling, I effortlessly get everyone
    on the same page.
  translation: Al enmarcar el panorama general con storytelling, alineo sin esfuerzo
    a todos.
  visual_hint: 🌍🤝
  cloze:
  - 3
  - 4
  glossary:
  - word: big picture
    meaning: panorama general / misma página
  - word: same page
    meaning: panorama general / misma página
  common: true
  kind: idiom
  apply_sentence: Keeping the ____ visible gets global stakeholders on the same page.
  apply_answer: big picture
  apply_translation: Mantener visible el panorama general alinea a los stakeholders
    globales.
- id: dhl-tl-1-5
  text: Having overseen sixty-plus specialists, I couple empathetic coaching with
    holding teams strictly accountable.
  translation: Tras supervisar más de sesenta especialistas, combino coaching empático
    con estricta rendición de cuentas.
  visual_hint: 👥📋
  cloze:
  - 1
  - 12
  glossary:
  - word: overseen
    meaning: supervisado / responsables
  - word: accountable
    meaning: supervisado / responsables
  common: true
  kind: idiom
  apply_sentence: To lead effectively, one must keep teams motivated yet strictly
    ____.
  apply_answer: accountable
  apply_translation: Para liderar eficazmente, hay que mantener al equipo motivado
    pero responsable.
roleplay:
  ai_role: DHL GSC Hiring Manager (Bogotá)
  user_role: Team Leader (Business Support) Candidate
  setting: 'Diálogo ejecutivo C2 con precisión retórica e inversión sintáctica sobre:
    Módulo 1: Perfil Profesional, Liderazgo GSC y Storytelling.'
  turns:
  - speaker: ai
    text: Were you tasked with scaling governance across global stakeholders, what
      strategic levers would you pull first?
  - speaker: user
    goal: Responde con estructuras C2 (inversión sintáctica, cláusulas enfáticas y
      modismos avanzados).
    suggested_lines:
    - Not only have I streamlined workflows, but I have also standardized reporting
      across the board.
    - Seldom do raw spreadsheets suffice; only data-driven insights truly move the
      needle.
  - speaker: ai
    text: How do you ensure operational excellence endures under peak pressure?
  - speaker: user
    goal: Articula tu respuesta con matices ejecutivos C2.
    suggested_lines:
    - Were we to automate capacity management, we would iron out friction and boost
      profitability.
    - By framing the big picture through storytelling, I effortlessly get everyone
      on the same page.
